{% extends "base.html" %}{% block title %}{{ page_title }} · Job Tracker{% endblock %}{% block content %}
<div class="mb-4"><a href="{{ url_for('applications') }}" class="small">← Back to applications</a><h1 class="h2 fw-bold mt-2">{{ page_title }}</h1></div>
{% set v = values if values else (job if job else {}) %}
<form method="post" class="panel form-panel"><div class="row g-3">
<div class="col-md-6"><label class="form-label">Company *</label><input class="form-control" name="company" required value="{{ v.get('company','') if v is mapping else v.company }}"></div><div class="col-md-6"><label class="form-label">Job title *</label><input class="form-control" name="role" required value="{{ v.get('role','') if v is mapping else v.role }}"></div>
<div class="col-md-6"><label class="form-label">Job type</label><select class="form-select" name="job_type">{% for t in ['Full-time','Part-time','Internship','Contract','Remote'] %}<option {% if (v.get('job_type','Full-time') if v is mapping else v.job_type)==t %}selected{% endif %}>{{ t }}</option>{% endfor %}</select></div>
<div class="col-md-6"><label class="form-label">Location</label><input class="form-control" name="location" value="{{ v.get('location','') if v is mapping else v.location }}"></div><div class="col-12"><label class="form-label">Job URL</label><input class="form-control" type="url" name="job_url" value="{{ v.get('job_url','') if v is mapping else v.job_url }}"></div>
<div class="col-md-4"><label class="form-label">Status</label><select class="form-select" name="status">{% for s in statuses %}<option {% if (v.get('status','Applied') if v is mapping else v.status)==s %}selected{% endif %}>{{ s }}</option>{% endfor %}</select></div>
<div class="col-md-4"><label class="form-label">Date applied</label><input class="form-control" type="date" name="applied_date" value="{{ (v.get('applied_date',today) if v is mapping else v.applied_date).isoformat() if (v.get('applied_date',today) if v is mapping else v.applied_date) is not string else (v.get('applied_date',today.isoformat()) if v is mapping else today.isoformat()) }}" required></div>
<div class="col-md-4"><label class="form-label">Interview date</label><input class="form-control" type="date" name="interview_date" value="{{ v.get('interview_date','') if v is mapping else (v.interview_date.isoformat() if v.interview_date else '') }}"></div>
<div class="col-md-6"><label class="form-label">Follow-up date</label><input class="form-control" type="date" name="follow_up_date" value="{{ v.get('follow_up_date','') if v is mapping else (v.follow_up_date.isoformat() if v.follow_up_date else '') }}"></div>
<div class="col-12"><label class="form-label">Notes</label><textarea class="form-control" rows="4" name="notes">{{ v.get('notes','') if v is mapping else v.notes }}</textarea></div>
<div class="col-12"><button class="btn btn-primary">Save application</button> <a class="btn btn-light" href="{{ url_for('applications') }}">Cancel</a></div></div></form>{% endblock %}
