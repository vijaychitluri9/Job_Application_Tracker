{% extends "base.html" %}{% block title %}Sign in · Job Tracker{% endblock %}{% block content %}
<div class="auth-wrap"><div class="auth-card"><div class="brand-mark">💼</div><h1 class="h3 fw-bold text-center">Welcome back</h1><p class="text-secondary text-center mb-4">Sign in to your Job Application Tracker</p>
<form method="post"><div class="mb-3"><label class="form-label" for="email">Email address</label><input class="form-control form-control-lg" type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" required></div>
<div class="mb-3"><label class="form-label" for="password">Password</label><input class="form-control form-control-lg" type="password" id="password" name="password" placeholder="Enter your password" autocomplete="current-password" required></div>
<button class="btn btn-primary btn-lg w-100 mt-2" type="submit">Sign in</button></form><p class="text-center mt-4 mb-0">New here? <a href="{{ url_for('register') }}">Create an account</a></p></div></div>{% endblock %}
